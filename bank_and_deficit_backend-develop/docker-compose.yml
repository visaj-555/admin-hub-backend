version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_and_deficit_backend
    ports:
      - '80:3001'
    depends_on:
      - redis
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: bank_and_deficit_redis
    ports:
      - '6379:6379'
    env_file:
      - .env
